<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef0f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Томсон">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Томсон</title>
<style>
:root{
  --bg:#eef0f3;
  --panel:#f6f7f9;
  --text:#1c1c1e;
  --muted:#8e8e93;
  --line:rgba(60,60,67,.12);
  --accent:#5b6cff;
  --accent-soft:rgba(91,108,255,.12);
  --danger:#ff3b30;
  --green:#34c759;
  --s1:-8px -8px 18px rgba(255,255,255,.95);
  --s2:8px 8px 18px rgba(168,174,186,.32);
  --si:inset 3px 3px 8px rgba(168,174,186,.28),inset -3px -3px 8px rgba(255,255,255,.9);
  --radius:22px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:transparent;outline:0}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:16px 14px calc(100px + var(--safe));min-height:100dvh;width:100%}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .3s}
.sync-dot.on{opacity:1;animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.4}}

/* Top */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-size:28px;font-weight:700;letter-spacing:-.6px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.ibtn{
  width:44px;height:44px;border-radius:14px;
  background:var(--panel);box-shadow:var(--s1),var(--s2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s
}
.ibtn:active{transform:scale(.94);box-shadow:var(--si)}
.ibtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Controls */
.controls{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.seg{
  display:flex;padding:4px;border-radius:14px;gap:2px;
  background:var(--bg);box-shadow:var(--si)
}
.seg button{
  padding:9px 16px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px
}
.seg button.on{
  background:var(--panel);color:var(--text);
  box-shadow:var(--s1),var(--s2)
}
.pill{
  padding:9px 14px;border-radius:14px;font-weight:600;font-size:14px;
  background:var(--panel);box-shadow:var(--s1),var(--s2);color:var(--text)
}
.pill:active{box-shadow:var(--si)}

/* Halls */
.halls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.halls::-webkit-scrollbar{display:none}
.hall{
  flex:0 0 auto;min-width:112px;padding:12px 14px;border-radius:16px;
  background:var(--panel);box-shadow:var(--s1),var(--s2);
  color:var(--muted);transition:all .18s
}
.hall.on{color:var(--text);box-shadow:var(--si);outline:2px solid var(--hall-color,rgba(91,108,255,.28))}
.hall b{display:block;font-size:15px;font-weight:700}
.hall span{font-size:11px;opacity:.7}
.hall .swatch{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.hall.all-hall{min-width:96px}

/* Date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.date-title{font-size:22px;font-weight:700;letter-spacing:-.4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.date-title:active{opacity:.7}
.nav{display:flex;gap:6px}
.nav .ibtn{width:38px;height:38px;border-radius:12px}
.nav .ibtn svg{width:16px;height:16px}

/* Calendar month */
.cal{background:var(--panel);border-radius:24px;padding:12px 8px 16px;box-shadow:var(--s1),var(--s2)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600}
.day{
  min-height:68px;padding:6px;border-radius:12px;cursor:pointer;position:relative
}
.day:active{background:rgba(255,255,255,.5)}
.day.today{outline:2px solid rgba(91,108,255,.3)}
.day.outside .daynum{color:var(--muted);opacity:.45}
.day.weekend .daynum{color:var(--danger);opacity:.85}
.day.weekend{background:rgba(255,59,48,.06)}
.dow.weekend{color:var(--danger);opacity:.85}
.daynum{font-size:14px;font-weight:650}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.dot{height:6px;width:6px;border-radius:50%;flex-shrink:0}
.dot.pay-full{box-shadow:0 0 0 1.5px #ff3b30}
.dot.pay-half{box-shadow:0 0 0 1.5px #ff8a8f}

/* Day timeline */
.dayview{display:grid;grid-template-columns:48px 1fr;gap:6px;max-height:70vh;overflow:auto}
.times{color:var(--muted);font-size:11px;font-weight:600}
.time{height:56px;padding-top:2px}
.timeline{
  position:relative;min-height:1008px;
  border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 56px)
}
.bitem{
  position:absolute;left:6px;right:4px;border-radius:12px;padding:8px 10px;
  overflow:hidden;cursor:pointer;
  background:var(--panel);
  box-shadow:3px 4px 12px rgba(160,165,175,.22),-2px -2px 8px rgba(255,255,255,.85);
  border-left:4px solid #9b9da3
}
.bitem.full{border-left-width:4px}
.bitem.half{border-left-width:4px}
.bitem.none{border-left-width:4px}
.bitem strong{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.bitem.google{opacity:.88;border-style:dashed}

/* Week view */
.week-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.wgrid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:2px;min-width:calc(7 * 70px + 44px)}
.whead{text-align:center;font-size:10px;font-weight:600;padding:6px 2px;color:var(--muted)}
.whead.weekend{color:var(--danger);opacity:.85}
.whead .wd{display:block;font-size:11px}
.whead .wn{display:block;font-size:16px;font-weight:700;margin-top:2px;color:var(--text)}
.whead.today .wn{color:var(--accent)}
.wcol{position:relative;min-height:640px;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 40px)}
.wcol.weekend{background-color:rgba(255,59,48,.04)}
.whour{font-size:10px;color:var(--muted);height:40px;padding:2px 4px;font-weight:600}
.wslot{
  position:absolute;left:2px;right:2px;border-radius:8px;padding:4px 5px;overflow:hidden;cursor:pointer;
  font-size:10px;line-height:1.2;
  background:var(--panel);box-shadow:2px 2px 8px rgba(160,165,175,.2);border-left:3px solid #999}
.wslot strong{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wslot small{color:var(--muted);font-size:9px}

/* Multi-hall day / week */
.multi-halls{overflow-x:auto;margin:0 -2px}
.multi-grid{
  display:grid;gap:2px;min-width:fit-content;
  grid-template-columns:44px repeat(var(--hall-cols,3),minmax(120px,1fr))
}
.hcol-head{text-align:center;font-size:12px;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.hcol-head .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.timeline-col{position:relative;min-height:960px;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 48px)}
.tslot{position:absolute;left:0;right:0;height:48px;z-index:1;touch-action:none}
.tslot.pressing::after{content:"";position:absolute;inset:4px;border-radius:10px;background:var(--accent-soft);border:2px dashed var(--accent);animation:lpulse .6s ease infinite}
@keyframes lpulse{50%{opacity:.5}}
.ghost{
  position:absolute;left:4px;right:4px;border-radius:10px;background:var(--accent-soft);border:2px dashed var(--accent);
  pointer-events:none;z-index:5
}
.bslot-multi{
  position:absolute;left:2px;right:2px;border-radius:10px;padding:6px 8px;
  background:var(--panel);box-shadow:2px 2px 8px rgba(160,165,175,.22);
  border-left:4px solid #9b9da3;overflow:hidden;cursor:pointer
}
.bslot-multi strong{display:block;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslot-multi small{display:block;color:var(--muted);font-size:10px;margin-top:2px}

/* Month picker */
.picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.picker-grid button{padding:14px;border-radius:14px;font-weight:600;background:var(--bg);box-shadow:var(--s1),var(--s2)}
.picker-grid button.on{background:var(--accent);color:#fff;box-shadow:none}
.year-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px}
.year-row span{font-size:24px;font-weight:700;min-width:80px;text-align:center}

.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:14px}

/* FAB */
.fab-wrap{
  position:fixed;left:50%;bottom:calc(18px + var(--safe));
  transform:translateX(-50%);z-index:30
}
.fab{
  display:flex;align-items:center;gap:8px;
  padding:14px 22px;border-radius:20px;
  background:#1c1c1e;color:#fff;font-weight:700;font-size:15px;
  box-shadow:6px 8px 20px rgba(0,0,0,.18),-3px -3px 12px rgba(255,255,255,.6)
}
.fab:active{transform:scale(.97)}
.fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}

/* Overlay / Sheet */
.overlay{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(20,22,26,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px;overflow:auto;align-items:flex-end;justify-content:center
}
.overlay.show{display:flex}
.sheet{
  width:min(520px,100%);max-height:92dvh;overflow-y:auto;
  background:var(--panel);border-radius:28px 28px 20px 20px;
  padding:18px 16px calc(20px + var(--safe));
  box-shadow:0 -8px 40px rgba(0,0,0,.12);
  animation:up .28s ease
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sheet-head .ibtn{width:36px;height:36px;border-radius:11px}
.sheet-head .ibtn svg{width:16px;height:16px}

/* Form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{
  background:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:var(--si)
}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{
  width:100%;font-size:15px;background:transparent;color:var(--text)
}
.field textarea{min-height:90px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  width:40px;height:40px;border-radius:12px;
  background:var(--bg);box-shadow:var(--s1),var(--s2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .15s
}
.tag.on{box-shadow:var(--si);background:var(--accent-soft)}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act{
  padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;
  background:var(--bg);box-shadow:var(--s1),var(--s2);
  display:inline-flex;align-items:center;gap:8px
}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.act.pri svg{stroke:#fff}
.act:active{box-shadow:var(--si)}
.act.pri{background:#1c1c1e;color:#fff;box-shadow:4px 6px 14px rgba(0,0,0,.16)}
.act.danger{color:var(--danger)}

/* Settings */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{
  flex:0 0 auto;padding:10px 14px;border-radius:12px;
  font-weight:600;font-size:13px;color:var(--muted)
}
.tabs button.on{
  background:var(--panel);color:var(--text);
  box-shadow:var(--s1),var(--s2)
}
.slist{display:grid;gap:8px}
.sitem{
  background:var(--bg);border-radius:16px;padding:14px;
  box-shadow:var(--si);display:flex;justify-content:space-between;align-items:center;gap:12px
}
.sitem b{display:block;font-size:15px}
.sitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sfield{background:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:var(--si);margin-bottom:8px}
.sfield label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.sfield input,.sfield textarea{width:100%;font-size:15px}

.hint{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe));
  transform:translateX(-50%) translateY(20px);
  background:#1c1c1e;color:#fff;padding:11px 18px;border-radius:16px;
  font-weight:600;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:100;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2)
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:420px){
  .form{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .day{min-height:52px}
  .brand{font-size:24px}
  .date-title{font-size:19px}
  .seg button{padding:8px 12px;font-size:13px}
}

/* iPhone 15 Pro landscape */
@media(orientation:landscape) and (max-height:480px){
  .app{padding:8px 12px calc(72px + var(--safe));max-width:none}
  .top{margin-bottom:8px}
  .brand{font-size:20px}
  .sub{display:none}
  .controls{margin-bottom:8px}
  .halls{padding-bottom:8px}
  .datebar{margin-bottom:6px}
  .dayview,.dayview.multi{max-height:calc(100dvh - 130px)}
  .fab-wrap{bottom:calc(10px + var(--safe))}
  .fab{padding:10px 16px;font-size:13px}
  .overlay{align-items:center}
  .sheet{max-height:96dvh;border-radius:20px}
  .wgrid{min-width:7* 55px + 44px}
  .wcol{min-height:420px}
}

/* iPad */
@media(min-width:768px){
  .app{max-width:820px;padding:20px 24px calc(100px + var(--safe))}
  .day{min-height:72px}
  .wgrid{grid-template-columns:52px repeat(7,1fr);min-width:auto}
  .dayview.multi{max-height:calc(100dvh - 240px)}
  .multi-grid{grid-template-columns:52px repeat(var(--hall-cols,3),minmax(140px,1fr))}
}

/* MacBook 16" / desktop */
@media(min-width:1200px){
  .app{max-width:1280px;padding:24px 32px calc(100px + var(--safe))}
  .top{margin-bottom:20px}
  .cal{padding:16px 12px 20px}
  .day{min-height:80px}
  .wcol{min-height:720px}
  .dayview.multi{max-height:calc(100dvh - 260px)}
  .multi-grid{grid-template-columns:52px repeat(var(--hall-cols,3),minmax(180px,1fr))}
  .sheet{width:min(600px,100%)}
  .overlay{align-items:center}
  .sheet{border-radius:24px;max-height:88dvh}
}

.ibtn svg,.fab svg,.act svg,.sheet-head .ibtn svg{display:block}
.ibtn svg use,.fab svg use,.act svg use{width:100%;height:100%}
</style>
</head>

<div class="app">
  <div class="top">
    <div>
      <div class="brand">Томсон</div>
      <div class="sub">Бронирование</div>
    </div>

/* ========== Calendar ========== */
function render(){
  renderHalls();
  loadGoogleEvents(allHallsMode ? null : hallId);
  if (view === "month") renderMonth();
  else if (view === "week") renderWeek();
  else renderDay();
}

function getHallColor(hallId) {
  return cfg.halls.find(h => h.id === hallId)?.color || "#9b9da3";
}

/* --- Month --- */
function renderMonth(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $("dateTitle").textContent = new Intl.DateTimeFormat("ru-RU",{month:"long",year:"numeric"}).format(cursor).replace(/^./,c=>c.toUpperCase());
  const first = new Date(y,m,1);
  const startDayOfWeek = (first.getDay()+6)%7; // Пн=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const lastDayPrev = new Date(y,m,0).getDate();
  let html = '<div class="cal"><div class="mgrid">';
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach((d,i) => {
    html += `<div class="dow ${i>=5?"weekend":""}">${d}</div>`;
  });
  // Предыдущий месяц
  for (let i=startDayOfWeek-1; i>=0; i--) {
    const day = lastDayPrev - i;
    const key = iso(new Date(y,m-1,day));
    html += `<div class="day outside" data-date="${key}"><div class="daynum">${day}</div></div>`;
  }
  // Текущий месяц
  const today = iso(new Date());
  const allBs = [...bookings, ...googleEvents];
  for (let d=1; d<=daysInMonth; d++){
    const key = iso(new Date(y,m,d));
    const dayOfWeek = new Date(y,m,d).getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    const bs = allHallsMode
      ? allBs.filter(b => b.date===key)
      : allBs.filter(b => b.hallId===hallId && b.date===key);
    html += `<div class="day ${key===today?"today":""} ${isWeekend?"weekend":""}" data-date="${key}">
      <div class="daynum">${d}</div>
      <div class="dots">${bs.slice(0,6).map(b=>`<span class="dot ${payCls(b.pay)}" style="background:${getHallColor(b.hallId)}"></span>`).join("")}</div>
    </div>`;
  }
  // Следующий месяц
  const totalCells = startDayOfWeek + daysInMonth;
  const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d=1; d<=nextDays; d++){
    const key = iso(new Date(y,m+1,d));
    html += `<div class="day outside" data-date="${key}"><div class="daynum">${d}</div></div>`;
  }
  html += "</div></div>";
  $("calendar").innerHTML = html;
  $("calendar").querySelectorAll(".day[data-date]").forEach(el => {
    el.onclick = () => openBooking(el.dataset.date);
  });
}

/* --- Day --- */
function renderDay(){
  const key = iso(cursor);
  $("dateTitle").textContent = new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(cursor).replace(/^./,c=>c.toUpperCase());
  if (allHallsMode) {
    renderMultiDay();
    return;
  }
  const allBs = [...bookings, ...googleEvents].filter(b => b.hallId===hallId && b.date===key)
    .sort((a,b) => a.start.localeCompare(b.start));
  let html = '<div class="cal"><div class="dayview"><div class="times">';
  for (let h=8; h<=25; h++) html += `<div class="time">${String(h%24).padStart(2,"0")}:00</div>`;
  html += '</div><div class="timeline" id="timelineSingle">';
  if (!allBs.length) html += '<div class="empty" style="position:absolute;inset:40px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px"><svg width="36" height="36" viewBox="0 0 24 24"><use href="#i-cal"/></svg><span>Нет броней</span></div>';
  allBs.forEach(b => {
    const [sh,sm] = b.start.split(":").map(Number);
    const [eh,em] = b.end.split(":").map(Number);
    const top = ((sh*60+sm) - 8*60) * (56/60);
    const hgt = Math.max(44, ((eh*60+em) - (sh*60+sm)) * (56/60));
    const tags = (b.tags||[]).join("");
    html += `<div class="bitem ${payCls(b.pay)}" style="top:${top}px;height:${hgt}px;border-color:${getHallColor(b.hallId)}" data-id="${b.id}">
      <strong>${paySym(b.pay)}${tags} ${esc(b.name)}</strong>
      <small>${b.start}–${b.end} · ${b.guests||"?"} чел.</small>
    </div>`;
  });
  html += "</div></div></div>";
  $("calendar").innerHTML = html;
  attachTimelineLongPress("timelineSingle", key, hallId);
  $("calendar").querySelectorAll(".bitem").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      if (el.dataset.id.startsWith("g_")) return;
      openBooking(null, el.dataset.id);
    };
  });
}

async function loadGoogleEvents(hallIds, startDate, endDate) {
  // hallIds – массив id залов; startDate/endDate – объекты Date
  let newGoogleEvents = [];
  for (const id of hallIds) {
    const items = await fetchGoogleCalendarEvents(id, startDate, endDate);
    items.forEach(event => {
      const sDate = new Date(event.start);
      const eDate = new Date(event.end);
      newGoogleEvents.push({
        id: "g_" + event.id,
        hallId: id,
        name: event.summary,
        date: iso(sDate),
        start: sDate.toTimeString().slice(0, 5),
        end: eDate.toTimeString().slice(0, 5),
        pay: "none",
        guests: 1,
        isGoogle: true
      });
    });
  }
  googleEvents = newGoogleEvents;
  // Рендер после загрузки
  if (view === "month") renderMonth();
  else if (view === "week") renderWeek();
  else renderDay();
  $("syncDot").classList.add("on");
  setTimeout(() => $("syncDot").classList.remove("on"), 1000);
}

let cfg = load("tomson_cfg", DEF);
let bookings = load("tomson_bk", []);
let hallId = cfg.halls[0]?.id || "sphere";
let allHallsMode = false;
let view = "month";
let cursor = new Date();
let editId = null;
let selTags = [];

function load(k, d) {
  try { const v = JSON.parse(localStorage.getItem(k)); return v ?? structuredClone(d); }
  catch { return structuredClone(d); }
}
function save() {
  localStorage.setItem("tomson_cfg", JSON.stringify(cfg));
  localStorage.setItem("tomson_bk", JSON.stringify(bookings));
}
function $(id){ return document.getElementById(id); }
function iso(d){ return d.toISOString().slice(0,10); }
function hall(){ return cfg.halls.find(h => h.id === hallId) || cfg.halls[0]; }
function money(n){ return new Intl.NumberFormat("ru-RU").format(n) + " ₽"; }
function priceOf(h, g){
  for (const [max, p] of h.prices) if (g <= max) return p;
  return h.prices.at(-1)?.[1] || 0;
}
function payCls(p){ return p === "full" ? "full" : p === "half" ? "half" : "none"; }
function paySym(p){ return p === "full" ? ".." : p === "half" ? "." : "-"; }
function toast(m){
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(window.__t); window.__t = setTimeout(() => t.classList.remove("show"), 2200);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ========== Phone helpers ========== */
function normPhone(r){
  let p = (r||"").replace(/\D/g,"");
  if (p.startsWith("8") && p.length===11) p = "7"+p.slice(1);
  if (p.length===10) p = "7"+p;
  return p;
}
function fmtPhone(r){
  const p = normPhone(r);
  if (p.length===11 && p[0]==="7")
    return `+7 (${p.slice(1,4)}) ${p.slice(4,7)}-${p.slice(7,9)}-${p.slice(9)}`;
  return r || "";
}

/* ========== Render halls ========== */
function renderHalls(){
  let html = cfg.halls.map(h =>
    `<button class="hall ${h.id===hallId && !allHallsMode?"on":""}" data-id="${h.id}"><b><span class="swatch" style="background:${h.color}"></span>${esc(h.name)}</b><span>офис ${esc(h.office)}</span></button>`
  ).join("");
  html += `<button class="hall all-hall ${allHallsMode?"on":""}" data-id="__all__"><b>Все залы</b></button>`;
  $("halls").innerHTML = html;
  $("halls").querySelectorAll(".hall").forEach(el => {
    el.onclick = () => {
      if (el.dataset.id === "__all__") {
        allHallsMode = true;
        hallId = cfg.halls[0]?.id || "sphere";
      } else {
        allHallsMode = false;
        hallId = el.dataset.id;
      }
      renderHalls();
      render();
    };
  });
}

/* ========== Calendar ========== */
function render(){
  renderHalls();

  // Какие залы загружать
  const hallsToLoad = allHallsMode
    ? cfg.halls.map(h => h.id)
    : [hallId];

  // Диапазон дат для запроса к Google
  let startDate, endDate;
  const y = cursor.getFullYear();
  const m = cursor.getMonth();

  if (view === "month") {
    // Месяц: расширяем диапазон на недели, захватывающие начало и конец
    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7; // Пн=0
    startDate = new Date(y, m, 1 - startDow);
    const endDow = (7 - (lastDay.getDay() + 6) % 7) % 7;
    endDate = new Date(y, m + 1, endDow);
    endDate.setHours(23, 59, 59, 999);
  } else if (view === "week") {
    startDate = getMonday(cursor);
    startDate.setHours(0, 0, 0, 0);
    endDate = new Date(startDate);
    endDate.setDate(startDate.getDate() + 6);
    endDate.setHours(23, 59, 59, 999);
  } else { // day
    startDate = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    endDate = new Date(startDate);
    endDate.setHours(23, 59, 59, 999);
  }

  // Загружаем события и после этого отрисовываем
  loadGoogleEvents(hallsToLoad, startDate, endDate);
}

function renderMultiDay(){
  const key = iso(cursor);
  const halls = cfg.halls;
  let html = `<div class="cal"><div class="multi-halls"><div class="multi-grid" style="--hall-cols:${halls.length}">`;
  html += '<div class="times" style="grid-row:2/-1">';
  for (let h=8; h<=25; h++) html += `<div class="time">${String(h%24).padStart(2,"0")}:00</div>`;
  html += '</div>';
  // Заголовки колонок
  halls.forEach(h => {
    html += `<div class="hcol-head"><span class="swatch" style="background:${h.color}"></span>${esc(h.name)}</div>`;
  });
  // Колонки таймлайнов
  halls.forEach(h => {
    html += `<div class="timeline-col" id="tl-${h.id}" data-hall="${h.id}"></div>`;
  });
  html += '</div></div></div>';
  $("calendar").innerHTML = html;
  const allBs = [...bookings, ...googleEvents].filter(b => b.date===key);
  halls.forEach(h => {
    const col = document.getElementById(`tl-${h.id}`);
    const bs = allBs.filter(b => b.hallId === h.id).sort((a,b) => a.start.localeCompare(b.start));
    bs.forEach(b => {
      const [sh,sm] = b.start.split(":").map(Number);
      const [eh,em] = b.end.split(":").map(Number);
      const top = ((sh*60+sm) - 8*60) * (48/60); // 48px per hour
      const hgt = Math.max(44, ((eh*60+em) - (sh*60+sm)) * (48/60));
      const div = document.createElement("div");
      div.className = `bslot-multi ${payCls(b.pay)}`;
      div.style.cssText = `top:${top}px;height:${hgt}px;border-color:${h.color}`;
      div.innerHTML = `<strong>${paySym(b.pay)}${(b.tags||[]).join("")} ${esc(b.name)}</strong><small>${b.start}–${b.end}</small>`;
      div.onclick = (e) => {
        e.stopPropagation();
        if (b.id.startsWith("g_")) return;
        openBooking(null, b.id);
      };
      col.appendChild(div);
    });
    attachTimelineLongPress(`tl-${h.id}`, key, h.id);
  });
}

/* --- Week view --- */
function renderWeek(){
  const start = getMonday(cursor);
  const end = new Date(start); end.setDate(start.getDate()+6);
  $("dateTitle").textContent = `${start.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})} – ${end.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}`;
  if (allHallsMode) {
    renderMultiWeek(start);
    return;
  }
  const allBs = [...bookings, ...googleEvents].filter(b => b.hallId===hallId && b.date >= iso(start) && b.date <= iso(end));
  let html = `<div class="cal"><div class="week-scroll"><div class="wgrid">`;
  html += '<div class="whour"></div>';
  // Дни недели
  const today = iso(new Date());
  for (let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = iso(d);
    html += `<div class="whead ${key===today?"today":""} ${d.getDay()%6===0?"weekend":""}"><span class="wd">${d.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span><span class="wn">${d.getDate()}</span></div>`;
  }
  // Часы
  for (let h=8; h<=25; h++){
    html += `<div class="whour">${String(h%24).padStart(2,"0")}:00</div>`;
    for (let i=0; i<7; i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const key = iso(d);
      const weekend = d.getDay()%6===0 ? " weekend" : "";
      html += `<div class="wcol${weekend}" id="wcol-${i}-${h}"></div>`;
    }
  }
  html += '</div></div></div>';
  $("calendar").innerHTML = html;
  // Заполнение событий
  for (let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = iso(d);
    const bs = allBs.filter(b => b.date===key);
    bs.forEach(b => {
      const [sh,sm] = b.start.split(":").map(Number);
      const [eh,em] = b.end.split(":").map(Number);
      const top = ((sh*60+sm) - 8*60) * (40/60); // 40px per hour
      const hgt = Math.max(30, ((eh*60+em) - (sh*60+sm)) * (40/60));
      const col = document.getElementById(`wcol-${i}-${Math.floor(sh)}`);
      if (col) {
        const slot = document.createElement("div");
        slot.className = `wslot ${payCls(b.pay)}`;
        slot.style.cssText = `top:${top}px;height:${hgt}px;border-color:${getHallColor(b.hallId)}`;
        slot.innerHTML = `<strong>${paySym(b.pay)}${esc(b.name)}</strong><small>${b.start}–${b.end}</small>`;
        slot.onclick = (e) => {
          e.stopPropagation();
          if (!b.id.startsWith("g_")) openBooking(null, b.id);
        };
        col.appendChild(slot);
      }
    });
  }
  // long press
  for (let i=0; i<7; i++){
    for (let h=8; h<=25; h++){
      const col = document.getElementById(`wcol-${i}-${h}`);
      if (col) {
        col.style.position = "relative";
        col.addEventListener("pointerdown", (e) => handleWeekLongPress(e, i, h, start));
      }
    }
  }
}

function getMonday(d) {
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}

/* --- Long press to create event --- */
function attachTimelineLongPress(containerId, date, hId) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  cont.style.touchAction = "none";
  let pressTimer, ghostEl, startHour;

  const clear = () => {
    clearTimeout(pressTimer);
    if (ghostEl) ghostEl.remove();
    ghostEl = null;
  };

  cont.addEventListener("pointerdown", (e) => {
    const rect = cont.getBoundingClientRect();
    const y = e.clientY - rect.top + cont.scrollTop;
    startHour = Math.max(8, Math.min(25, 8 + Math.floor(y / 48))); // 48px/h
    ghostEl = document.createElement("div");
    ghostEl.className = "ghost";
    ghostEl.style.top = `${(startHour-8)*48}px`;
    ghostEl.style.height = "48px";
    cont.appendChild(ghostEl);
    pressTimer = setTimeout(() => {
      ghostEl.classList.add("pressing");
    }, 500);
  });

  cont.addEventListener("pointermove", (e) => {
    if (!ghostEl) return;
    const rect = cont.getBoundingClientRect();
    const y = e.clientY - rect.top + cont.scrollTop;
    const endHour = Math.max(8, Math.min(25, 8 + Math.floor(y / 48)));
    ghostEl.style.top = `${Math.min(startHour, endHour-8)*48}px`;
    ghostEl.style.height = `${Math.abs(endHour - startHour)*48}px`;
  });

  cont.addEventListener("pointerup", () => {
    clearTimeout(pressTimer);
    if (ghostEl && ghostEl.classList.contains("pressing")) {
      openBooking(date, null, `${String(startHour).padStart(2,"0")}:00`);
    }
    clear();
  });
  cont.addEventListener("pointerleave", clear);
  cont.addEventListener("pointercancel", clear);
}

function handleWeekLongPress(e, dayIndex, hour, weekStart) {
  const d = new Date(weekStart); d.setDate(weekStart.getDate()+dayIndex);
  openBooking(iso(d), null, `${String(hour).padStart(2,"0")}:00`);

  hallId = hallId;

  openBooking(iso(d), null, `${String(hour).padStart(2,"0")}:00`);
}

/* ========== Booking sheet ========== */
function openBooking(date, id, presetTime){
  editId = id || null;
  const b = id ? bookings.find(x => x.id === id) : null;
  $("bkTitle").textContent = b ? "Бронь" : "Новая бронь";
  $("fName").value = b?.name || "";
  $("fPhone").value = b?.phone || "";
  $("fDate").value = b?.date || date || iso(cursor);
  $("fStart").value = b?.start || presetTime || "17:00";
  $("fEnd").value = b?.end || (presetTime ? String(parseInt(presetTime)+1).padStart(2,"0")+":00" : "18:00");
  $("fGuests").value = b?.guests || 1;
  $("fMsg").value = b?.messenger || "Telegram";
  $("fPay").value = b?.pay || "none";
  $("fNotes").value = b?.notes || "";
  selTags = [...(b?.tags || [])];
  renderTags();
  $("bkDel").style.display = b ? "" : "none";
  $("ovBooking").classList.add("show");
}
function renderTags(){
  $("fTags").innerHTML = cfg.tags.map(e =>
    `<button type="button" class="tag ${selTags.includes(e)?"on":""}" data-e="${e}">${e}</button>`
  ).join("");
  $("fTags").querySelectorAll(".tag").forEach(el => {
    el.onclick = () => {
      const e = el.dataset.e;
      if (selTags.includes(e)) selTags = selTags.filter(x => x !== e);
      else selTags.push(e);
      renderTags();
    };
  });
}
function closeBooking(){ $("ovBooking").classList.remove("show"); }

function saveBooking(){
  const h = hall();
  const data = {
    id: editId || (crypto.randomUUID?.() || String(Date.now())),
    hallId,
    name: $("fName").value.trim(),
    phone: $("fPhone").value.trim(),
    date: $("fDate").value,
    start: $("fStart").value,
    end: $("fEnd").value,
    guests: +$("fGuests").value || 1,
    messenger: $("fMsg").value,
    pay: $("fPay").value,
    tags: [...selTags],
    notes: $("fNotes").value,
    price: priceOf(h, +$("fGuests").value || 1)
  };
  if (!data.name || !data.date) { toast("Укажите имя и дату"); return; }
  const clash = bookings.find(b =>
    b.hallId === data.hallId && b.date === data.date && b.id !== data.id &&
    data.start < b.end && data.end > b.start
  );
  if (clash && !confirm("В это время уже есть бронь. Сохранить всё равно?")) return;
  const i = bookings.findIndex(x => x.id === data.id);
  if (i >= 0) bookings[i] = data; else bookings.push(data);
  editId = data.id;
  save();
  toast("Сохранено");
  render();
  $("bkDel").style.display = "";
}

function deleteBooking(){
  if (!editId || !confirm("Удалить бронь?")) return;
  bookings = bookings.filter(x => x.id !== editId);
  save(); closeBooking(); render(); toast("Удалено");
}

function cur(){ return bookings.find(x => x.id === editId); }

    .replaceAll("{{зал}}", h.name)
    .replaceAll("{{офис}}", h.office)
    .replaceAll("{{дата}}", b.date)
    .replaceAll("{{начало}}", b.start)
    .replaceAll("{{конец}}", b.end)
    .replaceAll("{{гостей}}", b.guests)
    .replaceAll("{{стоимость}}", money(b.price))
    .replaceAll("{{адрес}}", cfg.studio.address)

  const phone = normPhone(b.phone);
  if (!phone || phone.length < 11) { toast("Укажите телефон"); return; }
  const enc = encodeURIComponent(text);
  if (b.messenger === "WhatsApp") window.open(`https://wa.me/${phone}?text=${enc}`, "_blank");
  else if (b.messenger === "Telegram") window.open(`https://t.me/+${phone}?text=${enc}`, "_blank");

      toast("Скопировано — откройте MAX");
      setTimeout(() => { location.href = "https://max.ru"; }, 400);
    });
  }
}

    };
  }
  if (tab === "tags") {
    body.innerHTML = `<div class="slist">${cfg.tags.map((e,i) =>
      `<div class="sitem"><div><b style="font-size:20px">${e}</b></div>
       <button class="act danger" data-i="${i}">Удалить</button></div>`
    ).join("")}</div>
    <button class="act pri" style="margin-top:10px" id="addTag">Добавить тег</button>`;
    body.querySelectorAll("[data-i]").forEach(btn => {
      btn.onclick = () => {
        cfg.tags.splice(+btn.dataset.i, 1);
        save(); settingsTab("tags");
      };
    });
    $("addTag").onclick = () => {
      const e = prompt("Эмодзи тега"); if (!e) return;
      cfg.tags.push(e.trim()); save(); settingsTab("tags");
    };
  }
  if (tab === "data") {
    body.innerHTML = `
      <button class="act pri" id="expData">Экспорт JSON</button>
      <button class="act danger" style="margin-top:8px" id="resetData">Сбросить всё</button>
      <p class="hint" style="margin-top:12px">Экспорт сохраняет настройки и все брони.</p>`;
    $("expData").onclick = () => {
      const blob = new Blob([JSON.stringify({cfg,bookings},null,2)],{type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tomson-backup.json"; a.click();
    };
    $("resetData").onclick = () => {
      if (!confirm("Сбросить настройки и все брони?")) return;
      localStorage.removeItem("tomson_cfg");
      localStorage.removeItem("tomson_bk");
      location.reload();
    };
  }
}
function sField(label, id, val){
  return `<div class="sfield"><label>${label}</label><input id="${id}" value="${esc(val)}"></div>`;
}
function editHall(i){
  const h = cfg.halls[i];
  const name = prompt("Название", h.name); if (name===null) return;
  const office = prompt("Офис", h.office); if (office===null) return;
  const color = prompt("Цвет (hex)", h.color); if (color===null) return;
  const prices = prompt("Цены (макс=цена через запятую)\nНапример: 9=1500,15=1700,30=1900",
    h.prices.map(x => x.join("=")).join(","));
  if (prices===null) return;
  h.name = name; h.office = office; h.color = color;
  h.prices = prices.split(",").map(x => x.split("=").map(Number)).filter(x => x.length===2 && !isNaN(x[1]));
  save(); settingsTab("halls"); renderHalls(); toast("Зал обновлён");
}

/* ========== Month/Year Picker ========== */
let pickerYear, pickerMonth;
function openPicker(){
  pickerYear = cursor.getFullYear();
  pickerMonth = cursor.getMonth();
  $("pkYear").textContent = pickerYear;
  renderPickerMonths();
  $("ovPicker").classList.add("show");
}
function closePicker(){ $("ovPicker").classList.remove("show"); }
function renderPickerMonths(){
  const months = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  let html = "";
  months.forEach((m,i) => {
    html += `<button class="${i===pickerMonth && pickerYear===cursor.getFullYear()?"on":""}" data-m="${i}">${m}</button>`;
  });
  $("pkMonths").innerHTML = html;
  $("pkMonths").querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      pickerMonth = +btn.dataset.m;
      cursor = new Date(pickerYear, pickerMonth, 1);
      closePicker();
      render();
    };
  });
}
$("pkPrevY").onclick = () => { pickerYear--; $("pkYear").textContent = pickerYear; renderPickerMonths(); };
$("pkNextY").onclick = () => { pickerYear++; $("pkYear").textContent = pickerYear; renderPickerMonths(); };
$("pkClose").onclick = closePicker;
$("ovPicker").addEventListener("click", e => { if (e.target === $("ovPicker")) closePicker(); });

/* ========== Events ========== */
$("vMonth").onclick = () => { view="month"; updateViewButtons(); render(); };
$("vWeek").onclick = () => { view="week"; updateViewButtons(); render(); };
$("vDay").onclick = () => { view="day"; updateViewButtons(); render(); };
function updateViewButtons(){
  $("vMonth").classList.toggle("on", view==="month");
  $("vWeek").classList.toggle("on", view==="week");
  $("vDay").classList.toggle("on", view==="day");
}
$("btnToday").onclick = () => { cursor = new Date(); render(); };
$("prev").onclick = () => {
  if (view === "month") cursor.setMonth(cursor.getMonth()-1);
  else if (view === "week") cursor.setDate(cursor.getDate()-7);
  else cursor.setDate(cursor.getDate()-1);
  render();
};
$("next").onclick = () => {
  if (view === "month") cursor.setMonth(cursor.getMonth()+1);
  else if (view === "week") cursor.setDate(cursor.getDate()+7);
  else cursor.setDate(cursor.getDate()+1);
  render();
};
$("btnNew").onclick = () => openBooking();
$("btnSettings").onclick = openSettings;
$("btnRefresh").onclick = () => { loadGoogleEvents(allHallsMode ? null : hallId, true); toast("Обновлено"); };
$("dateTitle").onclick = openPicker;
$("bkClose").onclick = closeBooking;
$("stClose").onclick = closeSettings;
$("bkSave").onclick = saveBooking;
$("bkDel").onclick = deleteBooking;
$("bkSend1").onclick = () => sendMsg("first");
$("bkSend2").onclick = () => sendMsg("confirm");
$("bkICS").onclick = addICS;
$("bkGCal").onclick = addGCal;
$("stTabs").querySelectorAll("button").forEach(b => {
  b.onclick = () => settingsTab(b.dataset.tab);
});
$("ovBooking").addEventListener("click", e => { if (e.target === $("ovBooking")) closeBooking(); });
$("ovSettings").addEventListener("click", e => { if (e.target === $("ovSettings")) closeSettings(); });

// Автосинхронизация каждые 5 минут
if (syncTimer) clearInterval(syncTimer);
syncTimer = setInterval(() => loadGoogleEvents(allHallsMode ? null : hallId), 300000);

/* SW */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});

/* Init */
render();
</script>
</body>
</html>
