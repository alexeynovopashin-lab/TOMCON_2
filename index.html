<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef0f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Томсон">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Томсон</title>
<style>
:root{
  --bg:#eef0f3;
  --panel:#f6f7f9;
  --text:#1c1c1e;
  --muted:#8e8e93;
  --line:rgba(60,60,67,.12);
  --accent:#5b6cff;
  --accent-soft:rgba(91,108,255,.12);
  --danger:#ff3b30;
  --green:#34c759;
  --s1:-8px -8px 18px rgba(255,255,255,.95);
  --s2:8px 8px 18px rgba(168,174,186,.32);
  --si:inset 3px 3px 8px rgba(168,174,186,.28),inset -3px -3px 8px rgba(255,255,255,.9);
  --radius:22px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:transparent;outline:0}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:16px 14px calc(100px + var(--safe));min-height:100dvh;width:100%}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .3s}
.sync-dot.on{opacity:1;animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.4}}

/* Top */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-size:28px;font-weight:700;letter-spacing:-.6px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.ibtn{
  width:44px;height:44px;border-radius:14px;
  background:var(--panel);box-shadow:var(--s1),var(--s2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s
}
.ibtn:active{transform:scale(.94);box-shadow:var(--si)}
.ibtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Controls */
.controls{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.seg{
  display:flex;padding:4px;border-radius:14px;gap:2px;
  background:var(--bg);box-shadow:var(--si)
}
.seg button{
  padding:9px 16px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px
}
.seg button.on{
  background:var(--panel);color:var(--text);
  box-shadow:var(--s1),var(--s2)
}
.pill{
  padding:9px 14px;border-radius:14px;font-weight:600;font-size:14px;
  background:var(--panel);box-shadow:var(--s1),var(--s2);color:var(--text)
}
.pill:active{box-shadow:var(--si)}

/* Halls */
.halls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.halls::-webkit-scrollbar{display:none}
.hall{
  flex:0 0 auto;min-width:112px;padding:12px 14px;border-radius:16px;
  background:var(--panel);box-shadow:var(--s1),var(--s2);
  color:var(--muted);transition:all .18s
}
.hall.on{color:var(--text);box-shadow:var(--si);outline:2px solid var(--hall-color,rgba(91,108,255,.28))}
.hall b{display:block;font-size:15px;font-weight:700}
.hall span{font-size:11px;opacity:.7}
.hall .swatch{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.hall.all-hall{min-width:96px}

/* Date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.date-title{font-size:22px;font-weight:700;letter-spacing:-.4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.date-title:active{opacity:.7}
.nav{display:flex;gap:6px}
.nav .ibtn{width:38px;height:38px;border-radius:12px}
.nav .ibtn svg{width:16px;height:16px}

/* Calendar month */
.cal{background:var(--panel);border-radius:24px;padding:12px 8px 16px;box-shadow:var(--s1),var(--s2)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600}
.day{
  min-height:68px;padding:6px;border-radius:12px;cursor:pointer;position:relative
}
.day:active{background:rgba(255,255,255,.5)}
.day.today{outline:2px solid rgba(91,108,255,.3)}
.day.outside .daynum{color:var(--muted);opacity:.45}
.day.weekend .daynum{color:var(--danger);opacity:.85}
.day.weekend{background:rgba(255,59,48,.06)}
.dow.weekend{color:var(--danger);opacity:.85}
.daynum{font-size:14px;font-weight:650}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.dot{height:6px;width:6px;border-radius:50%;flex-shrink:0}
.dot.pay-full{box-shadow:0 0 0 1.5px #ff3b30}
.dot.pay-half{box-shadow:0 0 0 1.5px #ff8a8f}

/* Day timeline */
.dayview{display:grid;grid-template-columns:48px 1fr;gap:6px;max-height:70vh;overflow:auto}
.times{color:var(--muted);font-size:11px;font-weight:600}
.time{height:56px;padding-top:2px}
.timeline{
  position:relative;min-height:1008px;
  border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 56px)
}
.bitem{
  position:absolute;left:6px;right:4px;border-radius:12px;padding:8px 10px;
  overflow:hidden;cursor:pointer;
  background:var(--panel);
  box-shadow:3px 4px 12px rgba(160,165,175,.22),-2px -2px 8px rgba(255,255,255,.85);
  border-left:4px solid #9b9da3
}
.bitem.full{border-left-width:4px}
.bitem.half{border-left-width:4px}
.bitem.none{border-left-width:4px}
.bitem strong{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.bitem.google{opacity:.88;border-style:dashed}
/* Метка «нет телефона»: заметная, но не кричащая — это напоминание, а не ошибка */
.nophone{display:inline-block;margin-left:5px;padding:0 5px;border-radius:6px;
  background:#ffb020;color:#3a2a00;font-size:10px;font-weight:700;vertical-align:1px}
.warn{color:#b26a00}

/* Week view */
.week-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.wgrid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:2px;min-width:calc(7 * 70px + 44px)}
.whead{text-align:center;font-size:10px;font-weight:600;padding:6px 2px;color:var(--muted)}
.whead.weekend{color:var(--danger);opacity:.85}
.whead .wd{display:block;font-size:11px}
.whead .wn{display:block;font-size:16px;font-weight:700;margin-top:2px;color:var(--text)}
.whead.today .wn{color:var(--accent)}
.wcol{position:relative;min-height:640px;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 40px)}
.wcol.weekend{background-color:rgba(255,59,48,.04)}
.whour{font-size:10px;color:var(--muted);height:40px;padding:2px 4px;font-weight:600}
.wslot{
  position:absolute;left:2px;right:2px;border-radius:8px;padding:4px 5px;overflow:hidden;cursor:pointer;
  font-size:10px;line-height:1.2;
  background:var(--panel);box-shadow:2px 2px 8px rgba(160,165,175,.2);border-left:3px solid #999}
.wslot strong{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wslot small{color:var(--muted);font-size:9px}

/* Multi-hall day / week */
.multi-halls{overflow-x:auto;margin:0 -2px}
.multi-grid{
  display:grid;gap:2px;min-width:fit-content;
  grid-template-columns:44px repeat(var(--hall-cols,3),minmax(120px,1fr))
}
.hcol-head{text-align:center;font-size:12px;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.hcol-head .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.timeline-col{position:relative;min-height:960px;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 48px)}
.tslot{position:absolute;left:0;right:0;height:48px;z-index:1;touch-action:none}
.tslot.pressing::after{content:"";position:absolute;inset:4px;border-radius:10px;background:var(--accent-soft);border:2px dashed var(--accent);animation:lpulse .6s ease infinite}
@keyframes lpulse{50%{opacity:.5}}
.ghost{
  position:absolute;left:4px;right:4px;border-radius:10px;background:var(--accent-soft);border:2px dashed var(--accent);
  pointer-events:none;z-index:5
}
.bslot-multi{
  position:absolute;left:2px;right:2px;border-radius:10px;padding:6px 8px;
  background:var(--panel);box-shadow:2px 2px 8px rgba(160,165,175,.22);
  border-left:4px solid #9b9da3;overflow:hidden;cursor:pointer
}
.bslot-multi strong{display:block;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslot-multi small{display:block;color:var(--muted);font-size:10px;margin-top:2px}

/* Month picker */
.picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.picker-grid button{padding:14px;border-radius:14px;font-weight:600;background:var(--bg);box-shadow:var(--s1),var(--s2)}
.picker-grid button.on{background:var(--accent);color:#fff;box-shadow:none}
.year-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px}
.year-row span{font-size:24px;font-weight:700;min-width:80px;text-align:center}

.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:14px}

/* FAB */
.fab-wrap{
  position:fixed;left:50%;bottom:calc(18px + var(--safe));
  transform:translateX(-50%);z-index:30
}
.fab{
  display:flex;align-items:center;gap:8px;
  padding:14px 22px;border-radius:20px;
  background:#1c1c1e;color:#fff;font-weight:700;font-size:15px;
  box-shadow:6px 8px 20px rgba(0,0,0,.18),-3px -3px 12px rgba(255,255,255,.6)
}
.fab:active{transform:scale(.97)}
.fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}

/* Overlay / Sheet */
.overlay{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(20,22,26,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px;overflow:auto;align-items:flex-end;justify-content:center
}
.overlay.show{display:flex}
.sheet{
  width:min(520px,100%);max-height:92dvh;overflow-y:auto;
  background:var(--panel);border-radius:28px 28px 20px 20px;
  padding:18px 16px calc(20px + var(--safe));
  box-shadow:0 -8px 40px rgba(0,0,0,.12);
  animation:up .28s ease
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sheet-head .ibtn{width:36px;height:36px;border-radius:11px}
.sheet-head .ibtn svg{width:16px;height:16px}

/* Form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{
  background:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:var(--si)
}
.field.full{grid-column:1/-1}
/* Подзаголовки групп: форма читается блоками, а не сплошным списком полей */
.fgroup{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--muted);margin:6px 2px -2px}
.fgroup:first-child{margin-top:0}
.total{font-size:17px;font-weight:600;padding:9px 2px}
/* Выпадающий список оборудования */
.picker{background:var(--panel);border-radius:14px;padding:0;overflow:hidden}
.picker summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:12px 14px;font-size:14px;font-weight:600}
.picker summary::-webkit-details-marker{display:none}
.picker summary::after{content:"⌄";font-size:16px;color:var(--muted);margin-left:auto;padding-left:6px}
.picker[open] summary::after{content:"⌃"}
.picker-val{font-weight:400;color:var(--muted);font-size:13px;text-align:right}
.picker-body{padding:2px 8px 10px}
.eq{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  padding:10px 6px;font:inherit;text-align:left;cursor:pointer;color:inherit}
.eq+.eq{border-top:1px solid rgba(0,0,0,.05)}
.eq-box{width:20px;height:20px;border-radius:6px;flex:0 0 auto;
  border:1.5px solid rgba(0,0,0,.18);display:grid;place-items:center;font-size:12px;color:#fff}
.eq.on .eq-box{background:#111;border-color:#111}
.eq-name{flex:1}
.eq-price{color:var(--muted);font-size:13px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{
  width:100%;font-size:15px;background:transparent;color:var(--text)
}
.field textarea{min-height:90px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  width:40px;height:40px;border-radius:12px;
  background:var(--bg);box-shadow:var(--s1),var(--s2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .15s
}
.tag.on{box-shadow:var(--si);background:var(--accent-soft)}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act{
  padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;
  background:var(--bg);box-shadow:var(--s1),var(--s2);
  display:inline-flex;align-items:center;gap:8px
}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.act.pri svg{stroke:#fff}
.act:active{box-shadow:var(--si)}
.act.pri{background:#1c1c1e;color:#fff;box-shadow:4px 6px 14px rgba(0,0,0,.16)}
.act.danger{color:var(--danger)}

/* Settings */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{
  flex:0 0 auto;padding:10px 14px;border-radius:12px;
  font-weight:600;font-size:13px;color:var(--muted)
}
.tabs button.on{
  background:var(--panel);color:var(--text);
  box-shadow:var(--s1),var(--s2)
}
.slist{display:grid;gap:8px}
.sitem{
  background:var(--bg);border-radius:16px;padding:14px;
  box-shadow:var(--si);display:flex;justify-content:space-between;align-items:center;gap:12px
}
.sitem b{display:block;font-size:15px}
.sitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sfield{background:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:var(--si);margin-bottom:8px}
.sfield label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.sfield input,.sfield textarea{width:100%;font-size:15px}

.hint{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe));
  transform:translateX(-50%) translateY(20px);
  background:#1c1c1e;color:#fff;padding:11px 18px;border-radius:16px;
  font-weight:600;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:100;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2)
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:420px){
  .form{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .day{min-height:52px}
  .brand{font-size:24px}
  .date-title{font-size:19px}
  .seg button{padding:8px 12px;font-size:13px}
}

/* iPhone 15 Pro landscape */
@media(orientation:landscape) and (max-height:480px){
  .app{padding:8px 12px calc(72px + var(--safe));max-width:none}
  .top{margin-bottom:8px}
  .brand{font-size:20px}
  .sub{display:none}
  .controls{margin-bottom:8px}
  .halls{padding-bottom:8px}
  .datebar{margin-bottom:6px}
  .dayview,.dayview.multi{max-height:calc(100dvh - 130px)}
  .fab-wrap{bottom:calc(10px + var(--safe))}
  .fab{padding:10px 16px;font-size:13px}
  .overlay{align-items:center}
  .sheet{max-height:96dvh;border-radius:20px}
  .wgrid{min-width:7* 55px + 44px}
  .wcol{min-height:420px}
}

/* iPad */
@media(min-width:768px){
  .app{max-width:820px;padding:20px 24px calc(100px + var(--safe))}
  .day{min-height:72px}
  .wgrid{grid-template-columns:52px repeat(7,1fr);min-width:auto}
  .dayview.multi{max-height:calc(100dvh - 240px)}
  .multi-grid{grid-template-columns:52px repeat(var(--hall-cols,3),minmax(140px,1fr))}
}

/* MacBook 16" / desktop */
@media(min-width:1200px){
  .app{max-width:1280px;padding:24px 32px calc(100px + var(--safe))}
  .top{margin-bottom:20px}
  .cal{padding:16px 12px 20px}
  .day{min-height:80px}
  .wcol{min-height:720px}
  .dayview.multi{max-height:calc(100dvh - 260px)}
  .multi-grid{grid-template-columns:52px repeat(var(--hall-cols,3),minmax(180px,1fr))}
  .sheet{width:min(600px,100%)}
  .overlay{align-items:center}
  .sheet{border-radius:24px;max-height:88dvh}
}

.ibtn svg,.fab svg,.act svg,.sheet-head .ibtn svg{display:block}
.ibtn svg use,.fab svg use,.act svg use{width:100%;height:100%}
</style>
</head>

<script>
/* ========== Google Calendar Integration Config ========== */
/* Режим календарей.
   "test" — отладочные календари, можно свободно создавать и удалять события.
   "live" — рабочие календари студии.
   Переключать только после того, как пройден полный цикл проверок
   (см. ROADMAP.md, этапы 3-7). Переключение = одна строка ниже. */
const CALENDAR_MODE = "test";

const CALENDAR_SETS = {
  test: {
    edison: "6f89fde3c9c8fb16463cae64d30e92f3f3b96a3cf9fe3784dcf6d8d7f5616c13@group.calendar.google.com", // TOMCOH Edison test
    sphere: "5cd94eec5d9e29ae224dd1d75f8e6d06ce2234570ed22aeb1011df2d996ee5f3@group.calendar.google.com", // TOMCOH Sfera test
    vegas:  "8a5d49e1c87dd7cd07e6ee9382732b9515df65b334de1558f3bf6028617ed975@group.calendar.google.com"  // TOMCOH Vegas test
  },
  /* Рабочие календари залов ещё не заведены.
     Заполнить перед переключением CALENDAR_MODE на "live". */
  live: {
    edison: "",
    sphere: "",
    vegas:  ""
  }
};

const GOOGLE_CALENDARS = CALENDAR_SETS[CALENDAR_MODE] || CALENDAR_SETS.test;
const WORKER_URL = "https://tomson-auth.alexeynovopashin.workers.dev";

let googleEvents = [];
let syncTimer = null;

async function fetchGoogleCalendarEvents(hallKey, startDate, endDate) {
  const calendarId = GOOGLE_CALENDARS[hallKey];
  if (!calendarId) return [];
  const timeMin = startDate.toISOString();
  const timeMax = endDate.toISOString();
  const url = `${WORKER_URL}/calendar/calendars/${encodeURIComponent(calendarId)}/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
    const data = await response.json();
    return (data.items || []).map(event => ({
      id: event.id,
      summary: event.summary || "Без названия",
      description: event.description || "",
      start: new Date(event.start.dateTime || event.start.date),
      end: new Date(event.end.dateTime || event.end.date)
    }));
  } catch (err) {
    console.error(`Ошибка загрузки календаря (${hallKey}):`, err);
    return [];
  }
}

async function loadGoogleEvents(hallIds, startDate, endDate) {
  let newGoogleEvents = [];
  for (const id of hallIds) {
    const calendarId = calendarIdFor(id);
    const items = await fetchGoogleCalendarEvents(id, startDate, endDate);
    items.forEach(event => {
      /* Событие, созданное этим же приложением, уже представлено локальной
         бронью. Иначе оно показалось бы вторым «призрачным» блоком рядом
         с настоящим. Источник истины для таких событий — локальная бронь. */
      if (findBookingByGoogleEvent(event.id, calendarId)) return;

      const sDate = new Date(event.start);
      const eDate = new Date(event.end);
      newGoogleEvents.push({
        id: "g_" + event.id,
        googleEventId: event.id,
        googleCalendarId: calendarId,
        hallId: id,
        name: event.summary,
        date: iso(sDate),
        start: sDate.toTimeString().slice(0, 5),
        end: eDate.toTimeString().slice(0, 5),
        pay: "none",
        guests: 1,
        isGoogle: true
      });
    });
  }
  googleEvents = newGoogleEvents;

  if (view === "month") renderMonth();
  else if (view === "week") renderWeek();
  else renderDay();
  renderSummary();

  $("syncDot").classList.add("on");
  setTimeout(() => $("syncDot").classList.remove("on"), 1000);
}

/* ========== Запись в Google Calendar ==========
   Часовой пояс проставляется явно. Полагаться на часовой пояс браузера
   нельзя: администратор может работать из другого региона, и тогда
   событие уедет относительно реального времени съёмки. */
const CALENDAR_TZ = "Asia/Tomsk";

/* Тело события. Согласно CLAUDE_CONTEXT §27 summary держим коротким и
   пригодным для чтения в обычном календаре, а подробности уносим в
   description, а не склеиваем всё в название. */
function buildEventBody(b) {
  const h = cfg.halls.find(x => x.id === b.hallId) || hall();
  const description = [
    `Зал: ${h.name}`,
    b.phone ? `Телефон: ${fmtPhone(b.phone)}` : "",
    `Гостей: ${b.guests}`,
    `Оплата: ${paySym(b.pay)}`,
    (b.tags || []).length ? `Теги: ${b.tags.join(" ")}` : "",
    equipmentOf(b).length ? `Оборудование: ${equipmentOf(b).map(e => e.name).join(", ")}` : "",
    b.notes ? `Заметки: ${b.notes}` : "",
    b.price ? `Стоимость: ${money(bookingTotal(b))}` : "",
    "",
    `Создано в приложении «Томсон» · бронь ${b.id}`
  ].filter(Boolean).join("\n");

  return {
    summary: calTitle(b),
    location: `${cfg.studio.address}, ${cfg.studio.floor}, оф. ${h.office}, зал ${h.name}`,
    description,
    start: { dateTime: `${b.date}T${b.start}:00`, timeZone: CALENDAR_TZ },
    end:   { dateTime: `${b.date}T${b.end}:00`,   timeZone: CALENDAR_TZ }
  };
}

/* Создать событие и запомнить его id. Возвращает { ok, error }.
   Обновление существующего события — этап 4, поэтому здесь стоит защита:
   повторный вызов для уже связанной брони не создаёт второе событие. */
async function createGoogleEvent(b) {
  const calendarId = calendarIdFor(b.hallId);
  if (!calendarId) return { ok: false, error: "Для этого зала не задан календарь" };
  if (isLinkedToGoogle(b)) return { ok: false, error: "Бронь уже есть в календаре" };

  const url = `${WORKER_URL}/calendar/calendars/${encodeURIComponent(calendarId)}/events`;
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildEventBody(b))
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      const msg = data.error?.message || data.error || `HTTP ${res.status}`;
      return { ok: false, error: String(msg) };
    }
    if (!data.id) return { ok: false, error: "Google не вернул id события" };

    /* Записываем связь в саму бронь в массиве: b может быть копией. */
    const stored = bookings.find(x => x.id === b.id);
    if (stored) {
      stored.googleEventId = data.id;
      stored.googleCalendarId = calendarId;
      save();
    }
    return { ok: true, id: data.id };
  } catch (err) {
    return { ok: false, error: err.message || "Нет связи с сервером" };
  }
}

/* Обновить существующее событие. Если события в Google уже нет (его удалили
   вручную), связь считается устаревшей: сбрасываем её и создаём заново —
   иначе бронь навсегда осталась бы указывающей в пустоту. */
async function updateGoogleEvent(b) {
  const calendarId = b.googleCalendarId || calendarIdFor(b.hallId);
  if (!b.googleEventId || !calendarId) return { ok: false, error: "Бронь не связана с календарём" };

  const url = `${WORKER_URL}/calendar/calendars/${encodeURIComponent(calendarId)}/events/${encodeURIComponent(b.googleEventId)}`;
  try {
    const res = await fetch(url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildEventBody(b))
    });

    const data = await res.json().catch(() => ({}));

    /* Удалённое в Google событие не исчезает, а получает status "cancelled",
       и PATCH по нему возвращает 200, а не 404. Без этой проверки бронь
       осталась бы привязанной к событию, которого в календаре не видно. */
    const gone = res.status === 404 || res.status === 410 || data.status === "cancelled";
    if (gone) {
      const stored = bookings.find(x => x.id === b.id) || b;
      stored.googleEventId = null;
      stored.googleCalendarId = null;
      save();
      return createGoogleEvent(stored);
    }

    if (!res.ok || data.error) {
      const msg = data.error?.message || data.error || `HTTP ${res.status}`;
      return { ok: false, error: String(msg) };
    }
    return { ok: true, id: data.id };
  } catch (err) {
    return { ok: false, error: err.message || "Нет связи с сервером" };
  }
}

/* Удалить событие. Уже удалённое событие считаем успехом: цель —
   отсутствие события в календаре, и она достигнута. */
async function deleteGoogleEvent(eventId, calendarId) {
  if (!eventId || !calendarId) return { ok: true };
  const url = `${WORKER_URL}/calendar/calendars/${encodeURIComponent(calendarId)}/events/${encodeURIComponent(eventId)}`;
  try {
    const res = await fetch(url, { method: "DELETE" });
    if (res.ok || res.status === 404 || res.status === 410) return { ok: true };
    const data = await res.json().catch(() => ({}));
    return { ok: false, error: data.error?.message || `HTTP ${res.status}` };
  } catch (err) {
    return { ok: false, error: err.message || "Нет связи с сервером" };
  }
}

/* Единая точка выгрузки брони в Google: создать, обновить или перенести.
   Смена зала — это переезд в другой календарь: событие удаляется из старого
   и создаётся в новом, потому что перенести событие между календарями
   изменением полей нельзя. */
async function syncBookingToGoogle(b, prevCalendarId) {
  const target = calendarIdFor(b.hallId);
  if (!target) return { ok: false, error: "Для этого зала не задан календарь" };

  if (!isLinkedToGoogle(b)) return createGoogleEvent(b);

  const from = prevCalendarId || b.googleCalendarId;
  if (from && from !== target) {
    await deleteGoogleEvent(b.googleEventId, from);
    const stored = bookings.find(x => x.id === b.id) || b;
    stored.googleEventId = null;
    stored.googleCalendarId = null;
    save();
    return createGoogleEvent(stored);
  }

  return updateGoogleEvent(b);
}

/* Резервный путь: открыть веб-форму Google. Используется, если запись
   через API не прошла, чтобы администратор всё равно мог завести
   событие руками и не остался заблокированным (CLAUDE_CONTEXT §39). */
function openGCalWebForm(b) {
  const h = cfg.halls.find(x => x.id === b.hallId) || hall();
  const title = encodeURIComponent(calTitle(b));
  const loc = encodeURIComponent(`${cfg.studio.address}, оф. ${h.office}, ${h.name}`);
  const details = encodeURIComponent([`Зал: ${h.name}`, `Гостей: ${b.guests}`, b.notes || ""].filter(Boolean).join("\n"));
  const s = toICSDate(b.date + "T" + b.start + ":00");
  const e = toICSDate(b.date + "T" + b.end + ":00");
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${s}/${e}&details=${details}&location=${loc}&ctz=${CALENDAR_TZ}`, "_blank");
}

function load(k, d) {
  try { const v = JSON.parse(localStorage.getItem(k)); return v ?? structuredClone(d); }
  catch { return structuredClone(d); }
}
function save() {
  localStorage.setItem("tomson_cfg", JSON.stringify(cfg));
  localStorage.setItem("tomson_bk", JSON.stringify(bookings));
}

/* Настройки уже сохранены у администраторов в localStorage и новых полей
   не содержат. Дополняем недостающее, не трогая то, что настроено вручную. */
function migrateConfig(c) {
  if (!c || typeof c !== "object") return structuredClone(DEF);
  if (!Array.isArray(c.equipment)) c.equipment = structuredClone(DEF.equipment);
  return c;
}

/* ========== Прокат оборудования ==========
   Цена фиксированная за съёмку: не зависит ни от длительности, ни от
   количества гостей — в отличие от аренды зала. */
function equipmentList() {
  return Array.isArray(cfg.equipment) ? cfg.equipment : [];
}
function equipmentById(id) {
  return equipmentList().find(e => e.id === id) || null;
}
function equipmentOf(b) {
  return (b?.equipment || []).map(equipmentById).filter(Boolean);
}
function equipmentSum(b) {
  return equipmentOf(b).reduce((s, e) => s + (+e.price || 0), 0);
}
/* Итог по брони: аренда зала за все часы + разовое оборудование. */
function bookingTotal(b) {
  return (+b.price || 0) * hoursOf(b) + equipmentSum(b);
}
function hoursOf(b) {
  const [sh, sm] = String(b.start || "0:0").split(":").map(Number);
  const [eh, em] = String(b.end || "0:0").split(":").map(Number);
  const mins = (eh * 60 + em) - (sh * 60 + sm);
  return mins > 0 ? mins / 60 : 0;
}

/* ========== Связь брони с событием Google Calendar ==========
   googleEventId  — id события в Google. Пока пуст, бронь в Google не выгружалась.
   googleCalendarId — календарь, в котором лежит событие. Нужен отдельно от
   зала: при смене зала событие переносится в другой календарь, и старый
   календарь нужно знать, чтобы удалить событие оттуда.
   Без этой пары синхронизация будет создавать дубликаты (CLAUDE_CONTEXT §25). */

function migrateBookings(list) {
  if (!Array.isArray(list)) return [];
  return list.map(b => ({
    googleEventId: null,
    googleCalendarId: null,
    equipment: [],
    ...b
  }));
}

/* Календарь, в котором должна лежать бронь этого зала. */
function calendarIdFor(hallKey) {
  return GOOGLE_CALENDARS[hallKey] || null;
}

/* Локальная бронь, соответствующая событию Google. Единственное место,
   где устанавливается это соответствие: сопоставлять по времени и имени
   нельзя — и то и другое меняется. */
function findBookingByGoogleEvent(eventId, calendarId) {
  if (!eventId) return null;
  return bookings.find(b =>
    b.googleEventId === eventId &&
    (!calendarId || !b.googleCalendarId || b.googleCalendarId === calendarId)
  ) || null;
}

/* Бронь уже выгружена в Google? */
function isLinkedToGoogle(b) {
  return Boolean(b && b.googleEventId);
}
function $(id){ return document.getElementById(id); }

function iso(d){ 
  const offset = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - offset).toISOString().slice(0,10);
}

function hall(){ return cfg.halls.find(h => h.id === hallId) || cfg.halls[0]; }
function money(n){ return new Intl.NumberFormat("ru-RU").format(n) + " ₽"; }
function priceOf(h, g){
  for (const [max, p] of h.prices) if (g <= max) return p;
  return h.prices.at(-1)?.[1] || 0;
}
function payCls(p){ return p === "full" ? "full" : p === "half" ? "half" : "none"; }

/* Бронь без телефона — потерянный клиент: время занято, а связаться не с кем.
   Номер часто узнают уже после записи (из входящих, из переписки), поэтому
   делать поле обязательным нельзя — вместо этого помечаем такие брони,
   пока номер не появится. События из Google не помечаем: они заведены не
   здесь, и телефона у них может не быть по своей причине. */
function needsPhone(b){
  return Boolean(b) && !b.isGoogle && normPhone(b.phone).length !== 11;
}
function phoneMark(b){
  return needsPhone(b) ? '<span class="nophone" title="Нет телефона">☎</span>' : "";
}
function paySym(p){ return p === "full" ? ".." : p === "half" ? "." : "-"; }
function toast(m){
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(window.__t); window.__t = setTimeout(() => t.classList.remove("show"), 2200);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ========== Phone helpers ========== */
function normPhone(r){
  let p = (r||"").replace(/\D/g,"");
  if (p.startsWith("8") && p.length===11) p = "7"+p.slice(1);
  if (p.length===10) p = "7"+p;
  return p;
}
function fmtPhone(r){
  const p = normPhone(r);
  if (p.length===11 && p[0]==="7")
    return `+7 (${p.slice(1,4)}) ${p.slice(4,7)}-${p.slice(7,9)}-${p.slice(9)}`;
  return r || "";
}

/* Форматирование прямо во время набора. Номер приводится к единому виду
   +7 (923) 412-33-30, каким бы способом его ни продиктовали: 9234123330,
   89234123330, 79234123330, с пробелами или скобками. Единый формат нужен
   не для красоты — иначе один и тот же клиент не находится поиском. */
function livePhone(raw){
  let d = (raw || "").replace(/\D/g, "");
  if (d.startsWith("8")) d = "7" + d.slice(1);
  else if (d.startsWith("9")) d = "7" + d;
  if (!d.startsWith("7")) d = d ? "7" + d : "";
  d = d.slice(0, 11);
  if (!d) return "";

  const a = d.slice(1, 4), b = d.slice(4, 7), c = d.slice(7, 9), e = d.slice(9, 11);
  let out = "+7";
  if (a) out += ` (${a}`;
  if (a.length === 3) out += ")";
  if (b) out += ` ${b}`;
  if (c) out += `-${c}`;
  if (e) out += `-${e}`;
  return out;
}

function attachPhoneFormatting(el){
  const apply = () => {
    const atEnd = el.selectionStart === el.value.length;
    const formatted = livePhone(el.value);
    if (formatted === el.value) return;
    el.value = formatted;
    if (atEnd) el.setSelectionRange(formatted.length, formatted.length);
  };
  el.addEventListener("input", apply);
  el.addEventListener("blur", apply);
}

/* ========== Render halls ========== */
function renderHalls(){
  let html = cfg.halls.map(h =>
    `<button class="hall ${h.id===hallId && !allHallsMode?"on":""}" data-id="${h.id}"><b><span class="swatch" style="background:${h.color}"></span>${esc(h.name)}</b><span>офис ${esc(h.office)}</span></button>`
  ).join("");
  html += `<button class="hall all-hall ${allHallsMode?"on":""}" data-id="__all__"><b>Все залы</b></button>`;
  $("halls").innerHTML = html;
  $("halls").querySelectorAll(".hall").forEach(el => {
    el.onclick = () => {
      if (el.dataset.id === "__all__") {
        allHallsMode = true;
        hallId = cfg.halls[0]?.id || "sphere";
      } else {
        allHallsMode = false;
        hallId = el.dataset.id;
      }
      renderHalls();
      render();
    };
  });
}

/* ========== Calendar ========== */
function render(){
  renderHalls();
  renderSummary();

  const hallsToLoad = allHallsMode
    ? cfg.halls.map(h => h.id)
    : [hallId];

  let startDate, endDate;
  const y = cursor.getFullYear();
  const m = cursor.getMonth();

  if (view === "month") {
    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    startDate = new Date(y, m, 1 - startDow);
    const endDow = (7 - (lastDay.getDay() + 6) % 7) % 7;
    endDate = new Date(y, m + 1, endDow);
    endDate.setHours(23, 59, 59, 999);
  } else if (view === "week") {
    startDate = getMonday(cursor);
    startDate.setHours(0, 0, 0, 0);
    endDate = new Date(startDate);
    endDate.setDate(startDate.getDate() + 6);
    endDate.setHours(23, 59, 59, 999);
  } else {
    startDate = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    endDate = new Date(startDate);
    endDate.setHours(23, 59, 59, 999);
  }

  loadGoogleEvents(hallsToLoad, startDate, endDate);
}

function getHallColor(hallId) {
  return cfg.halls.find(h => h.id === hallId)?.color || "#9b9da3";
}

/* --- Month --- */
function renderMonth(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $("dateTitle").textContent = new Intl.DateTimeFormat("ru-RU",{month:"long",year:"numeric"}).format(cursor).replace(/^./,c=>c.toUpperCase());
  const first = new Date(y,m,1);
  const startDayOfWeek = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const lastDayPrev = new Date(y,m,0).getDate();
  let html = '<div class="cal"><div class="mgrid">';
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach((d,i) => {
    html += `<div class="dow ${i>=5?"weekend":""}">${d}</div>`;
  });
  
  for (let i=startDayOfWeek-1; i>=0; i--) {
    const day = lastDayPrev - i;
    const key = iso(new Date(y,m-1,day));
    html += `<div class="day outside" data-date="${key}"><div class="daynum">${day}</div></div>`;
  }
  
  const today = iso(new Date());
  const allBs = [...bookings, ...googleEvents];
  for (let d=1; d<=daysInMonth; d++){
    const key = iso(new Date(y,m,d));
    const dayOfWeek = new Date(y,m,d).getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    const bs = allHallsMode
      ? allBs.filter(b => b.date===key)
      : allBs.filter(b => b.hallId===hallId && b.date===key);
    html += `<div class="day ${key===today?"today":""} ${isWeekend?"weekend":""}" data-date="${key}">
      <div class="daynum">${d}</div>
      <div class="dots">${bs.slice(0,6).map(b=>`<span class="dot ${payCls(b.pay)}" style="background:${getHallColor(b.hallId)}"></span>`).join("")}</div>
    </div>`;
  }
  
  const totalCells = startDayOfWeek + daysInMonth;
  const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d=1; d<=nextDays; d++){
    const key = iso(new Date(y,m+1,d));
    html += `<div class="day outside" data-date="${key}"><div class="daynum">${d}</div></div>`;
  }
  html += "</div></div>";
  $("calendar").innerHTML = html;
  /* Клик по дню открывает этот день, а не форму новой брони.
     Раньше посмотреть дату из месяца было невозможно: открывалась форма,
     и до нужного числа приходилось идти по одному дню в дневном виде.
     Создание брони осталось на долгом нажатии и на кнопке «Новая бронь». */
  $("calendar").querySelectorAll(".day[data-date]").forEach(el => {
    const date = el.dataset.date;
    let timer = null, fired = false;

    const start = () => {
      fired = false;
      timer = setTimeout(() => { fired = true; timer = null; openBooking(date); }, 500);
    };
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };

    el.addEventListener("touchstart", start, { passive: true });
    el.addEventListener("touchmove", cancel, { passive: true });
    el.addEventListener("touchend", cancel);
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", cancel);
    el.addEventListener("mouseleave", cancel);

    el.onclick = () => {
      cancel();
      /* Долгое нажатие уже открыло форму — обычный клик после него
         не должен вдобавок уводить в дневной вид. */
      if (fired) { fired = false; return; }
      goToDay(date);
    };
  });
}

/* Перейти к конкретному дню из месяца или недели. */
function goToDay(dateKey){
  const [y, m, d] = dateKey.split("-").map(Number);
  cursor = new Date(y, m - 1, d);
  view = "day";
  updateViewButtons();
  render();
}

/* --- Day --- */
function renderDay(){
  const key = iso(cursor);
  $("dateTitle").textContent = new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(cursor).replace(/^./,c=>c.toUpperCase());
  if (allHallsMode) {
    renderMultiDay();
    return;
  }
  const allBs = [...bookings, ...googleEvents].filter(b => b.hallId===hallId && b.date===key)
    .sort((a,b) => a.start.localeCompare(b.start));
  let html = '<div class="cal"><div class="dayview"><div class="times">';
  for (let h=8; h<=25; h++) html += `<div class="time">${String(h%24).padStart(2,"0")}:00</div>`;
  html += '</div><div class="timeline" id="timelineSingle">';
  if (!allBs.length) html += '<div class="empty" style="position:absolute;inset:40px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px"><svg width="36" height="36" viewBox="0 0 24 24"><use href="#i-cal"/></svg><span>Нет броней</span></div>';
  allBs.forEach(b => {
    const [sh,sm] = b.start.split(":").map(Number);
    const [eh,em] = b.end.split(":").map(Number);
    const top = ((sh*60+sm) - 8*60) * (56/60);
    const hgt = Math.max(44, ((eh*60+em) - (sh*60+sm)) * (56/60));
    const tags = (b.tags||[]).join("");
    html += `<div class="bitem ${payCls(b.pay)}" style="top:${top}px;height:${hgt}px;border-color:${getHallColor(b.hallId)}" data-id="${b.id}">
      <strong>${paySym(b.pay)}${tags} ${esc(b.name)}${phoneMark(b)}</strong>
      <small>${b.start}–${b.end} · ${b.guests||"?"} чел.</small>
    </div>`;
  });
  html += "</div></div></div>";
  $("calendar").innerHTML = html;
  attachTimelineLongPress("timelineSingle", key, hallId);
  $("calendar").querySelectorAll(".bitem").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      if (el.dataset.id.startsWith("g_")) return;
      openBooking(null, el.dataset.id);
    };
  });
}

function renderMultiDay(){
  const key = iso(cursor);
  const halls = cfg.halls;
  let html = `<div class="cal"><div class="multi-halls"><div class="multi-grid" style="--hall-cols:${halls.length}">`;
  html += '<div class="times" style="grid-row:2/-1">';
  for (let h=8; h<=25; h++) html += `<div class="time">${String(h%24).padStart(2,"0")}:00</div>`;
  html += '</div>';
  halls.forEach(h => {
    html += `<div class="hcol-head"><span class="swatch" style="background:${h.color}"></span>${esc(h.name)}</div>`;
  });
  halls.forEach(h => {
    html += `<div class="timeline-col" id="tl-${h.id}" data-hall="${h.id}"></div>`;
  });
  html += '</div></div></div>';
  $("calendar").innerHTML = html;
  const allBs = [...bookings, ...googleEvents].filter(b => b.date===key);
  halls.forEach(h => {
    const col = document.getElementById(`tl-${h.id}`);
    const bs = allBs.filter(b => b.hallId === h.id).sort((a,b) => a.start.localeCompare(b.start));
    bs.forEach(b => {
      const [sh,sm] = b.start.split(":").map(Number);
      const [eh,em] = b.end.split(":").map(Number);
      const top = ((sh*60+sm) - 8*60) * (48/60);
      const hgt = Math.max(44, ((eh*60+em) - (sh*60+sm)) * (48/60));
      const div = document.createElement("div");
      div.className = `bslot-multi ${payCls(b.pay)}`;
      div.style.cssText = `top:${top}px;height:${hgt}px;border-color:${h.color}`;
      div.innerHTML = `<strong>${paySym(b.pay)}${(b.tags||[]).join("")} ${esc(b.name)}${phoneMark(b)}</strong><small>${b.start}–${b.end}</small>`;
      div.onclick = (e) => {
        e.stopPropagation();
        if (b.id.startsWith("g_")) return;
        openBooking(null, b.id);
      };
      col.appendChild(div);
    });
    attachTimelineLongPress(`tl-${h.id}`, key, h.id);
  });
}

/* --- Week view --- */
function renderWeek(){
  const start = getMonday(cursor);
  const end = new Date(start); end.setDate(start.getDate()+6);
  $("dateTitle").textContent = `${start.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})} – ${end.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}`;
  
  if (allHallsMode) {
    renderMultiWeek(start);
    return;
  }
  
  const allBs = [...bookings, ...googleEvents].filter(b => b.hallId===hallId && b.date >= iso(start) && b.date <= iso(end));
  let html = `<div class="cal"><div class="week-scroll"><div class="wgrid">`;
  
  html += '<div style="grid-column:1;grid-row:1"></div>';

  for (let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);

    html += `<div class="whead ${key===today?"today":""} ${d.getDay()%6===0?"weekend":""}" style="grid-row:1;grid-column:${i+2}">
      <span class="wd">${d.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span>
      <span class="wn">${d.getDate()}</span>
    </div>`;
  }
  
  html += `<div style="grid-column:1;grid-row:2;position:relative">`;
  for(let h=8; h<=25; h++) html += `<div class="whour">${String(h%24).padStart(2,"0")}:00</div>`;
  html += `</div>`;
  
  for (let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const weekend = d.getDay()%6===0 ? " weekend" : "";
    html += `<div class="wcol${weekend}" id="wcol-${i}" style="grid-row:2;grid-column:${i+2};position:relative;"></div>`;
  }
  
  html += '</div></div></div>';
  $("calendar").innerHTML = html;

  for (let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = iso(d);
    const bs = allBs.filter(b => b.date===key);
    const col = document.getElementById(`wcol-${i}`);
    
    if (col) {
      bs.forEach(b => {
        const [sh,sm] = b.start.split(":").map(Number);
        const [eh,em] = b.end.split(":").map(Number);
        const top = ((sh*60+sm) - 8*60) * (40/60);
        const hgt = Math.max(30, ((eh*60+em) - (sh*60+sm)) * (40/60));
        const slot = document.createElement("div");
        slot.className = `wslot ${payCls(b.pay)}`;
        slot.style.cssText = `top:${top}px;height:${hgt}px;border-color:${getHallColor(b.hallId)}`;

        col.appendChild(slot);
      });
      col.addEventListener("pointerdown", (e) => handleWeekLongPress(e, i, start, hallId));

  html += `</div>`;

  halls.forEach((hall, hIndex) => {
    for(let i=0; i<7; i++){

          const [eh,em] = b.end.split(":").map(Number);
          const top = ((sh*60+sm) - 8*60) * (40/60);
          const hgt = Math.max(30, ((eh*60+em) - (sh*60+sm)) * (40/60));
          const slot = document.createElement("div");
          slot.className = `wslot ${payCls(b.pay)}`;
          slot.style.cssText = `top:${top}px;height:${hgt}px;border-color:${hall.color}`;
          slot.innerHTML = `<strong>${paySym(b.pay)}${esc(b.name)}${phoneMark(b)}</strong><small>${b.start}–${b.end}</small>`;
          slot.onclick = (e) => { e.stopPropagation(); if (!b.id.startsWith("g_")) openBooking(null, b.id); };
          col.appendChild(slot);
        });
        col.addEventListener("pointerdown", (e) => handleWeekLongPress(e, i, start, hall.id));
      }
    }
  });
}

function getMonday(d) {
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}

/* --- Long press to create event (исправленная версия) --- */
function attachTimelineLongPress(containerId, date, hId) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  const rowHeight = containerId === "timelineSingle" ? 56 : 48;
  const stepMin = cfg.timeStep || 60;                // шаг в минутах
  const stepPx = rowHeight * (stepMin / 60);         // пикселей на один шаг

  let pressTimer, ghostEl, startHour, startMin, endHour, endMin;

  // округлить значение до ближайшего шага вниз (в пикселях)
  function roundDown(px) {
    return Math.floor(px / stepPx) * stepPx;
  }

  function pxToTime(px) {
    const totalMin = 8 * 60 + (px / rowHeight) * 60;
    const h = Math.floor(totalMin / 60);
    const m = Math.floor(totalMin % 60);
    return { h, m };
  }

  const clear = () => {
    clearTimeout(pressTimer);
    if (ghostEl) ghostEl.remove();
    ghostEl = null;
  };

  cont.addEventListener("pointerdown", (e) => {
    const rect = cont.getBoundingClientRect();
    const y = e.clientY - rect.top + cont.scrollTop;
    const roundedY = roundDown(y);
    const { h, m } = pxToTime(roundedY);
    startHour = h;
    startMin = m;
    endHour = h;
    endMin = m;

    ghostEl = document.createElement("div");
    ghostEl.className = "ghost";
    ghostEl.style.top = `${roundedY}px`;
    ghostEl.style.height = `${stepPx}px`;
    cont.appendChild(ghostEl);

    pressTimer = setTimeout(() => {
      if (ghostEl) ghostEl.classList.add("pressing");
    }, 400);
  });

  cont.addEventListener("pointermove", (e) => {
    if (!ghostEl || !ghostEl.classList.contains("pressing")) return;
    const rect = cont.getBoundingClientRect();
    const y = e.clientY - rect.top + cont.scrollTop;
    const roundedY = roundDown(y);
    const { h, m } = pxToTime(roundedY);
    endHour = h;
    endMin = m;

    const topPx = Math.min((startHour * 60 + startMin - 8 * 60) / 60 * rowHeight,
                           (endHour * 60 + endMin - 8 * 60) / 60 * rowHeight);
    const bottomPx = Math.max((startHour * 60 + startMin - 8 * 60) / 60 * rowHeight,
                              (endHour * 60 + endMin - 8 * 60) / 60 * rowHeight);
    ghostEl.style.top = `${topPx}px`;
    ghostEl.style.height = `${Math.max(stepPx, bottomPx - topPx)}px`;
  });

  cont.addEventListener("pointerup", () => {
    clearTimeout(pressTimer);
    if (ghostEl && ghostEl.classList.contains("pressing")) {
      // Формируем времена
      let sH = startHour, sM = startMin;
      let eH = endHour, eM = endMin;
      // если начало > конца, меняем
      if (sH * 60 + sM > eH * 60 + eM) {
        [sH, sM, eH, eM] = [eH, eM, sH, sM];
      }
      // минимальная длительность — один шаг
      if (sH * 60 + sM >= eH * 60 + eM) {
        eH = sH + Math.floor((sM + stepMin) / 60);
        eM = (sM + stepMin) % 60;
      }
      const startStr = `${String(sH).padStart(2,"0")}:${String(sM).padStart(2,"0")}`;
      const endStr = `${String(eH).padStart(2,"0")}:${String(eM).padStart(2,"0")}`;
      openBooking(date, null, startStr, hId, endStr);
    }
    clear();
  });
  cont.addEventListener("pointerleave", clear);
  cont.addEventListener("pointercancel", clear);
}

function handleWeekLongPress(e, dayIndex, weekStart, hId) {
  const col = e.currentTarget;
  const rect = col.getBoundingClientRect();
  const y = e.clientY - rect.top + col.scrollTop;
  const rowHeight = 40;
  const stepMin = cfg.timeStep || 60;
  const stepPx = rowHeight * (stepMin / 60);

  const roundedY = Math.floor(y / stepPx) * stepPx;
  const totalMin = 8 * 60 + (roundedY / rowHeight) * 60;
  let h = Math.floor(totalMin / 60);
  let m = Math.floor(totalMin % 60);

  const d = new Date(weekStart); d.setDate(weekStart.getDate()+dayIndex);
  const startStr = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  // конец по умолчанию + шаг
  let eH = h + Math.floor((m + stepMin) / 60);
  let eM = (m + stepMin) % 60;
  const endStr = `${String(eH).padStart(2,"0")}:${String(eM).padStart(2,"0")}`;
  openBooking(iso(d), null, startStr, hId, endStr);
}

/* Сводка в шапке. Заменила подпись «Томсон · Бронирование»: та повторяла
   название приложения, которое и так на иконке, и ничего не сообщала.
   Здесь отвечаем на вопрос, ради которого приложение чаще всего и
   открывают: что со студией прямо сейчас. */
/* Сводка в шапке.
   Считается по периоду, который открыт на экране, а не только по сегодня:
   студия работает на недели вперёд, и «сегодня» отвечает лишь на малую
   часть вопросов. Вторая строка отдана броням без телефона — это то,
   что теряет клиента, поэтому она вытесняет всё остальное. */
function renderSummary(){
  const period = visibleRange();
  const inPeriod = b => b.date >= period.from && b.date <= period.to;
  const mine = b => allHallsMode || b.hallId === hallId;
  const list = [...bookings, ...googleEvents].filter(b => inPeriod(b) && mine(b));

  const n = list.length;
  const word = (n % 10 === 1 && n % 100 !== 11) ? "бронь"
             : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? "брони" : "броней";
  $("todayCount").textContent = n ? `${period.label} · ${n} ${word}` : `${period.label} · свободно`;

  const noPhone = list.filter(needsPhone);
  if (noPhone.length) {
    const d = noPhone.length;
    const w = (d % 10 === 1 && d % 100 !== 11) ? "бронь без телефона"
            : ([2,3,4].includes(d % 10) && ![12,13,14].includes(d % 100)) ? "брони без телефона" : "броней без телефона";
    $("todayHalls").innerHTML = `<span class="warn">☎ ${d} ${w}</span>`;
    return;
  }

  /* Телефоны в порядке — показываем, что со студией прямо сейчас,
     но только если сегодняшний день попадает в открытый период. */
  const today = iso(new Date());
  if (today < period.from || today > period.to) { $("todayHalls").textContent = ""; return; }

  const now = new Date().toTimeString().slice(0,5);
  const todays = list.filter(b => b.date === today);
  const busy = cfg.halls.map(h => {
    const cur = todays.filter(b => b.hallId === h.id && b.start <= now && b.end > now)
                      .sort((a,b) => b.end.localeCompare(a.end))[0];
    return cur ? `${h.name} до ${cur.end}` : null;
  }).filter(Boolean);
  const next = todays.filter(b => b.start > now).sort((a,b) => a.start.localeCompare(b.start))[0];

  $("todayHalls").textContent =
    busy.length ? `Сейчас занято: ${busy.join(", ")}`
    : next ? `Ближайшая сегодня в ${next.start} · ${(cfg.halls.find(h=>h.id===next.hallId)||{}).name || ""}`
    : "Сегодня залы свободны";
}

/* Период, открытый на экране, и его человеческое название. */
function visibleRange(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  if (view === "month") {
    return {
      from: iso(new Date(y, m, 1)),
      to: iso(new Date(y, m + 1, 0)),
      label: new Intl.DateTimeFormat("ru-RU", { month: "long" }).format(cursor).replace(/^./, c => c.toUpperCase())
    };
  }
  if (view === "week") {
    const start = getMonday(cursor);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    const f = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short" });
    return { from: iso(start), to: iso(end), label: `${f.format(start)} – ${f.format(end)}` };
  }
  const key = iso(cursor);
  const isToday = key === iso(new Date());
  return {
    from: key, to: key,
    label: isToday ? "Сегодня" : new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" }).format(cursor)
  };
}

/* Выпадающий список проката. Цена показана у каждой позиции, чтобы

    ? `${chosen.length} · ${money(chosen.reduce((s,e)=>s+(+e.price||0),0))}`

/* Итог пересчитывается на лету: администратор называет сумму клиенту
   прямо во время разговора, а не после сохранения. */
function updateTotal(){
  const h = cfg.halls.find(x => x.id === $("fHall").value) || hall();
  const draft = {
    price: priceOf(h, +$("fGuests").value || 1),
    start: $("fStart").value, end: $("fEnd").value,
    equipment: selEquip
  };
  const hours = hoursOf(draft);
  const total = bookingTotal(draft);
  const eq = equipmentSum(draft);
  $("fTotal").textContent = hours ? money(total) : "—";
  $("fTotal").title = hours
    ? `Зал ${money(draft.price)} × ${hours} ч${eq ? ` + оборудование ${money(eq)}` : ""}`
    : "";
}

function renderTags(){
  $("fTags").innerHTML = cfg.tags.map(e =>
    `<button type="button" class="tag ${selTags.includes(e)?"on":""}" data-e="${e}">${e}</button>`
  ).join("");
  $("fTags").querySelectorAll(".tag").forEach(el => {
    el.onclick = () => {
      const e = el.dataset.e;
      if (selTags.includes(e)) selTags = selTags.filter(x => x !== e);
      else selTags.push(e);
      renderTags();
    };
  });
}
function closeBooking(){ $("ovBooking").classList.remove("show"); }

function saveBooking(){
  const selectedHallId = $("fHall").value;
  const h = cfg.halls.find(x => x.id === selectedHallId) || hall();
  
  /* Форма не содержит служебных полей, поэтому связь с Google берём из
     существующей брони, иначе каждое сохранение обрывало бы её и
     следующая синхронизация создала бы дубликат события. */
  const prev = editId ? bookings.find(x => x.id === editId) : null;

  const data = {
    id: editId || (crypto.randomUUID?.() || String(Date.now())),
    hallId: selectedHallId,
    googleEventId: prev?.googleEventId ?? null,
    googleCalendarId: prev?.googleCalendarId ?? null,
    name: $("fName").value.trim(),
    phone: $("fPhone").value.trim(),
    date: $("fDate").value,
    start: $("fStart").value,
    end: $("fEnd").value,
    guests: +$("fGuests").value || 1,
    messenger: $("fMsg").value,
    pay: $("fPay").value,
    tags: [...selTags],
    equipment: [...selEquip],
    notes: $("fNotes").value,
    price: priceOf(h, +$("fGuests").value || 1)
  };
  
  if (!data.name || !data.date) { toast("Укажите имя и дату"); return; }
  
  const allBs = [...bookings, ...googleEvents];
  const clash = allBs.find(b =>
    b.hallId === data.hallId && b.date === data.date && b.id !== data.id &&
    data.start < b.end && data.end > b.start
  );
  if (clash && !confirm("В это время уже есть бронь. Сохранить всё равно?")) return;
  
  const i = bookings.findIndex(x => x.id === data.id);
  if (i >= 0) bookings[i] = data; else bookings.push(data);
  editId = data.id;
  save();
  toast("Сохранено");
  render();
  $("bkDel").style.display = "";

  /* Бронь уходит в календарь сама. Отдельная кнопка означала бы, что
     выгрузку можно забыть нажать, и расписание разошлось бы с приложением.
     Локальное сохранение уже состоялось и не откатывается: сбой Google
     не должен стоить администратору введённых данных. */
  syncBookingToGoogle(data, prev?.googleCalendarId).then(res => {
    if (res.ok) { toast(isLinkedToGoogle(prev) ? "Календарь обновлён" : "Добавлено в календарь"); render(); }
    else { console.error("Google Calendar:", res.error); toast("Календарь не обновлён: " + res.error); }
  });
}

function deleteBooking(){
  if (!editId || !confirm("Удалить бронь?")) return;

  /* Событие в Google удаляем до того, как потеряем ссылку на него.
     Если удалить бронь первой, googleEventId исчезнет и событие
     останется в календаре навсегда. */
  const b = bookings.find(x => x.id === editId);
  if (isLinkedToGoogle(b)) {
    deleteGoogleEvent(b.googleEventId, b.googleCalendarId || calendarIdFor(b.hallId)).then(res => {
      if (!res.ok) { console.error("Google Calendar:", res.error); toast("Событие в календаре осталось: " + res.error); }
    });
  }

  bookings = bookings.filter(x => x.id !== editId);
  save(); closeBooking(); render(); toast("Удалено");
}

function buildConfirm(b){
  if (cfg.messages.confirm) return interp(cfg.messages.confirm, b);
  const h = cfg.halls.find(x => x.id === b.hallId) || hall();
  return `✅Бронь подтверждена.\n${h.confExtra}\n${h.confShoe}\n❗️Внося предоплату Вы соглашаетесь с ПРАВИЛАМИ и ЦЕНАМИ фотостудии\n${cfg.studio.rules}\nВАЖНО: Перенос возможен не позднее 48 часов до времени брони.\nПри отмене позднее предоплата сгорает.\n📍Адрес и как нас найти:\n${cfg.studio.find}\n${cfg.studio.address}\n${cfg.studio.floor}, ${h.office} офис, зал ${h.name}`;
}
function fmtPrices(h){
  return h.prices.map(([max,p],i) => {
    const prev = i === 0 ? 1 : h.prices[i-1][0]+1;
    return `${prev}-${max} чел/час ${p}₽`;
  }).join("\n");
}
function interp(tpl, b){
  const h = cfg.halls.find(x => x.id === b.hallId) || hall();
  return tpl
    .replaceAll("{{имя}}", b.name)
    .replaceAll("{{телефон}}", b.phone)
    .replaceAll("{{зал}}", h.name)
    .replaceAll("{{офис}}", h.office)
    .replaceAll("{{дата}}", b.date)
    .replaceAll("{{начало}}", b.start)
    .replaceAll("{{конец}}", b.end)
    .replaceAll("{{гостей}}", b.guests)
    .replaceAll("{{стоимость}}", money(b.price))
    .replaceAll("{{адрес}}", cfg.studio.address)
    .replaceAll("{{правила}}", cfg.studio.rules)
    .replaceAll("{{как_найти}}", cfg.studio.find);
}

function sendMsg(type){
  let b = cur();
  if (!b) { saveBooking(); b = cur(); }
  if (!b) { toast("Сначала сохраните бронь"); return; }
  const text = type === "first" ? buildFirst(b) : buildConfirm(b);
  const phone = normPhone(b.phone);
  if (!phone || phone.length < 11) { toast("Укажите телефон"); return; }
  const enc = encodeURIComponent(text);
  if (b.messenger === "WhatsApp") window.open(`https://wa.me/${phone}?text=${enc}`, "_blank");
  else if (b.messenger === "Telegram") window.open(`https://t.me/+${phone}?text=${enc}`, "_blank");
  else {
    navigator.clipboard.writeText(text).then(() => {
      toast("Скопировано — откройте MAX");
      setTimeout(() => { location.href = "https://max.ru"; }, 400);
    });
  }
}

/* ========== Calendar export ========== */
function calTitle(b){
  const tags = (b.tags||[]).join("");
  return `${tags}${paySym(b.pay)}${b.name} ${fmtPhone(b.phone)}`;
}
function toICSDate(s){ return s.replace(/[-:]/g,"").slice(0,15); }
function addICS(){
  let b = cur();
  if (!b) { saveBooking(); b = cur(); }
  if (!b) return;
  const h = cfg.halls.find(x => x.id === b.hallId) || hall();
  const title = calTitle(b);
  const loc = `${cfg.studio.address}, ${cfg.studio.floor}, оф. ${h.office}, зал ${h.name}`;
  const desc = [`Зал: ${h.name}`,`Гостей: ${b.guests}`,b.notes?`Заметки: ${b.notes}`:"",`Статус: ${paySym(b.pay)}`,``,cfg.studio.find,cfg.studio.rules].filter(Boolean).join("\\n");
  const uid = `tomson-${b.id}@studio`;
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Томсон//RU","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VTIMEZONE","TZID:Asia/Tomsk",
    "BEGIN:STANDARD","TZOFFSETFROM:+0700","TZOFFSETTO:+0700","TZNAME:+07","DTSTART:19700101T000000","END:STANDARD",
    "END:VTIMEZONE","BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${toICSDate(new Date().toISOString().replace(/\.\d{3}Z$/,""))}Z`,
    `DTSTART;TZID=Asia/Tomsk:${toICSDate(b.date+"T"+b.start+":00")}`,
    `DTEND;TZID=Asia/Tomsk:${toICSDate(b.date+"T"+b.end+":00")}`,
    `SUMMARY:${title}`,
    `LOCATION:${loc}`,
    `DESCRIPTION:${desc}`,
    "STATUS:CONFIRMED","END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Томсон_${h.name}_${b.date}.ics`;
  a.click();
  toast("Файл .ics создан");
}
function addGCal(){
  let b = cur();
  if (!b) { saveBooking(); b = cur(); }
  if (!b) return;

  if (isLinkedToGoogle(b)) { toast("Уже в календаре"); return; }

  toast("Добавляю в календарь…");
  createGoogleEvent(b).then(res => {
    if (res.ok) {
      toast("Добавлено в календарь");
      render();
      return;
    }
    /* API не сработал — не оставляем администратора ни с чем:
       предлагаем завести событие через веб-форму Google. */
    console.error("Google Calendar:", res.error);
    if (confirm(`Не удалось добавить через приложение:\n${res.error}\n\nОткрыть Google Календарь и добавить вручную?`)) {
      openGCalWebForm(b);
    }
  });
}

  const y = cursor.getFullYear(), m = cursor.getMonth();
  if (view === "month") {
    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m+1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    startDate = new Date(y, m, 1 - startDow);
    const endDow = (7 - (lastDay.getDay() + 6) % 7) % 7;
    endDate = new Date(y, m+1, endDow);
    endDate.setHours(23,59,59,999);
  } else if (view === "week") {
    startDate = getMonday(cursor);
    startDate.setHours(0,0,0,0);
    endDate = new Date(startDate);
    endDate.setDate(startDate.getDate()+6);
    endDate.setHours(23,59,59,999);
  } else {
    startDate = new Date(y, cursor.getMonth(), cursor.getDate());
    endDate = new Date(startDate);
    endDate.setHours(23,59,59,999);
  }
  loadGoogleEvents(hallsToLoad, startDate, endDate);

    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m+1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    startDate = new Date(y, m, 1 - startDow);
    const endDow = (7 - (lastDay.getDay() + 6) % 7) % 7;
    endDate = new Date(y, m+1, endDow);
    endDate.setHours(23,59,59,999);
  } else if (view === "week") {
    startDate = getMonday(cursor);
    startDate.setHours(0,0,0,0);
    endDate = new Date(startDate);
    endDate.setDate(startDate.getDate()+6);
    endDate.setHours(23,59,59,999);
  } else {
    startDate = new Date(y, cursor.getMonth(), cursor.getDate());
    endDate = new Date(startDate);
    endDate.setHours(23,59,59,999);
  }
  loadGoogleEvents(hallsToLoad, startDate, endDate);
}, 300000);

/* SW */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});

/* Init */
render();
